name: OldSettings

options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  OldSettings:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OldSettings
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: OldSettings
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.oldsettings
        INFOPLIST_FILE: OldSettings/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: Photos.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreLocation.framework
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
    scheme:
      testTargets: []
